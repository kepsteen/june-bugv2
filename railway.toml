[build]
builder = "RAILPACK"
buildCommand = "pnpm build:deploy"
watchPatterns = [
  "apps/**",
  "packages/**",
  "scripts/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
]

[deploy]
preDeployCommand = ["pnpm --filter @starter/api db:migrate"]
startCommand = "pnpm --filter @starter/api start"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
